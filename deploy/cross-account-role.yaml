AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TracerAI cross-account read-only role for network discovery. Deploy this into
  each account TracerAI should be able to read (for example via a CloudFormation
  StackSet across an Organization). It creates a role that the account running
  TracerAI can assume to read VPC route tables, security groups, NACLs and
  related network config. Read only: no permission to change anything.

Parameters:
  TrustedAccountId:
    Type: String
    Description: The AWS account ID where TracerAI runs and assumes this role.
    AllowedPattern: '^[0-9]{12}$'

  TracerAIRoleName:
    Type: String
    Default: TracerAI-Agent
    Description: The role name in the trusted account that is allowed to assume this role.

  ExternalId:
    Type: String
    Description: A shared external id the caller must present (prevents confused-deputy).
    NoEcho: true

  RoleName:
    Type: String
    Default: TracerAI-ReadOnly
    Description: The name of the role created in this account.

Resources:
  TracerAIReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${TrustedAccountId}:role/${TracerAIRoleName}'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      Policies:
        - PolicyName: TracerAINetworkRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ec2:DescribeRouteTables'
                  - 'ec2:DescribeVpcs'
                  - 'ec2:DescribeSubnets'
                  - 'ec2:DescribeSecurityGroups'
                  - 'ec2:DescribeNetworkAcls'
                  - 'ec2:DescribeTransitGatewayAttachments'
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeNetworkInterfaces'
                Resource: '*'

Outputs:
  RoleArn:
    Description: ARN of the created read-only role.
    Value: !GetAtt TracerAIReadOnlyRole.Arn
